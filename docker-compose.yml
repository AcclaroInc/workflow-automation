# =============================================================================
# Shared configuration for n8n services
# =============================================================================
x-n8n-shared: &n8n-shared
  image: n8n-custom
  build:
    context: .
    dockerfile: docker/images/n8n-custom/Dockerfile
    args:
      - N8N_VERSION=2.4.2
  restart: always
  env_file:
    - .env
  environment:
    # N8N Configuration
    - N8N_HOST=${N8N_HOST}
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - NODE_ENV=production
    - WEBHOOK_URL=https://${N8N_HOST}/
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Denver}
    # Database
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    # Queue (Redis)
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    # Security
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    # Node.js function settings
    - NODE_FUNCTION_ALLOW_BUILTIN=fs
    - NODE_FUNCTION_ALLOW_EXTERNAL=xml2js
  volumes:
    - n8n_data:/home/node/.n8n
    - ./local-files:/files
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # =============================================================================
  # PostgreSQL - Database
  # =============================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER}
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-internal
      - shared-network

  # =============================================================================
  # Redis - Queue & Cache
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-internal

  # =============================================================================
  # N8N - Main Application
  # =============================================================================
  n8n:
    <<: *n8n-shared
    container_name: n8n
    expose:
      - "5678"
    networks:
      - n8n-internal
      - shared-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # N8N Worker - Queue Processing
  # =============================================================================
  n8n-worker:
    <<: *n8n-shared
    container_name: n8n-worker
    command: worker
    depends_on:
      - n8n
    networks:
      - n8n-internal

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal network for n8n services
  n8n-internal:
    driver: bridge
  # External shared network for nginx proxy
  shared-network:
    external: true
    name: acclaro-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  n8n_data:
  postgres_data:
  redis_data:
